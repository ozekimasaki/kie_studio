name: release

on:
  push:
    tags:
      - 'v*'

# Needed for softprops/action-gh-release to create/update the GitHub Release.
permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      # Each OS builds independently; one failing platform must not cancel the
      # others (Electrobun cannot cross-compile).
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Determine channel
        id: channel
        shell: bash
        run: |
          # Prerelease-style tags (v1.2.3-canary / -beta / -rc) publish to the
          # canary channel as a GitHub prerelease; everything else is stable.
          if [[ "${GITHUB_REF_NAME}" == *canary* || "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *rc* ]]; then
            echo "channel=canary" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install

      - name: Install agent dependencies
        run: bun install --cwd agent

      - name: Build desktop app
        env:
          # Static host for differential auto-updates. Empty disables updates.
          RELEASE_BASE_URL: ${{ secrets.RELEASE_BASE_URL }}
        run: bun run desktop:build:${{ steps.channel.outputs.channel }}

      - name: Build Linux .deb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Electrobun only emits tar.gz/tar.zst for Linux; wrap the executable
          # tree from build/<channel>-linux-x64 into a .deb (dpkg-deb ships with
          # the Ubuntu runner) and drop it next to the other artifacts so the
          # publish step uploads it too.
          bun scripts/build-linux-deb.mjs ${{ steps.channel.outputs.channel }}
          cp release/*.deb artifacts/

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Inno Setup 6 is pre-installed on GitHub-hosted Windows runners.
          # Verify ISCC.exe is reachable; install via winget as a fallback.
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue
          if ($null -eq $iscc) {
            winget install --id JRSoftware.InnoSetup --accept-package-agreements --accept-source-agreements --silent
          }

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Build the proper Inno Setup installer (ARP-registered, full uninstaller)
          # instead of shipping Electrobun's bare Setup.exe.
          bun scripts/build-win-installer.mjs ${{ steps.channel.outputs.channel }}
          Copy-Item -Path "release\*-Setup.exe" -Destination artifacts\ -Force

      # softprops/action-gh-release races on matrix create/update and can fail
      # with tag_name already_exists even after the Release exists (Windows
      # then never uploads). Create-if-missing + upload --clobber is stable.
      - name: Publish to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            create_args=(--title "$TAG" --generate-notes)
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            # Another matrix job may create first; ignore that race.
            gh release create "$TAG" "${create_args[@]}" || true
          fi

          for _ in $(seq 1 30); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          gh release view "$TAG" >/dev/null

          # Installers plus auto-update payload (.tar.zst / .patch / update.json).
          # The Windows .zip stays as a static-host fallback.
          files=(
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.tar.zst
            artifacts/*.patch
            artifacts/*.json
          )
          if ((${#files[@]} == 0)); then
            echo "No release artifacts matched; skipping upload."
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
