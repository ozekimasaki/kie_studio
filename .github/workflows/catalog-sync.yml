name: catalog-sync

# Keep the bundled src/data/catalog.json current with docs.kie.ai.
# Opens / updates a PR instead of pushing main directly.
on:
  schedule:
    # 00:00 JST
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Bypass llms.txt hash skip and 70% shrink protection
        type: boolean
        default: false

concurrency:
  group: catalog-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # `gh workflow run ci.yml` で PR ブランチの CI を起動するため
  actions: write

jobs:
  sync:
    name: sync bundled catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Optional PAT so the catalog PR still triggers CI (GITHUB_TOKEN PRs do not).
          token: ${{ secrets.CATALOG_SYNC_TOKEN || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Sync catalog from docs.kie.ai
        run: |
          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            bun run sync:models -- --force
          else
            bun run sync:models -- --ignore-age
          fi

      - name: Open or update catalog PR
        env:
          GH_TOKEN: ${{ secrets.CATALOG_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git add src/data/catalog.json
          if git diff --cached --quiet; then
            echo "Bundled catalog is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/catalog-sync
          git commit -m "chore(catalog): docs.kie.ai からモデル一覧を同期"
          git push --force origin chore/catalog-sync

          pr_number=$(gh pr list --head chore/catalog-sync --state open --json number --jq '.[0].number // empty')
          if [[ -n "$pr_number" ]]; then
            echo "Updated existing catalog-sync PR #$pr_number."
          else
            body_file=$(mktemp)
            cat > "$body_file" <<'EOF'
          scope: low-risk

          docs.kie.ai から `src/data/catalog.json` を再生成した定期同期です。70% 縮小保護は `--force` でない限り維持しています。

          変更は `src/data/catalog.json` のみ。CI（lint / test / types / build）と Reviewer の承認が揃えば auto-merge されます。
          EOF
            gh pr create \
              --base main \
              --head chore/catalog-sync \
              --title "chore(catalog): 同梱モデルカタログを更新" \
              --body-file "$body_file"
            pr_number=$(gh pr list --head chore/catalog-sync --state open --json number --jq '.[0].number // empty')
          fi

          # 低リスク PR の無人マージ経路:
          # 1. ラベルで Reviewer（Cursor Automation）に低リスク判定の根拠を渡す
          # 2. auto-merge を予約する（branch protection の required check + 承認1 が揃った時点で GitHub がマージ）
          # 3. GITHUB_TOKEN が開いた PR では pull_request イベントが発火しないため、CI を明示的に起動する
          gh pr edit "$pr_number" --add-label "low-risk" --add-label "auto-merge"
          if ! gh pr merge "$pr_number" --auto --squash; then
            echo "::warning::auto-merge を予約できませんでした（allow_auto_merge と branch protection を確認）。PR #$pr_number は手動マージ待ちです。"
          fi
          gh workflow run ci.yml --ref chore/catalog-sync
