<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2280"/>
      <stop offset="0.5" stop-color="#231a62"/>
      <stop offset="1" stop-color="#130c34"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#8b7cf8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b7cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kBody" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e8e4fc"/>
      <stop offset="1" stop-color="#c9c0f8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c5cfc"/>
    </linearGradient>
    <linearGradient id="spark1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#glow)"/>

  <!-- Bold geometric K monogram -->
  <!-- Vertical stem -->
  <rect x="272" y="218" width="128" height="588" rx="18" fill="url(#kBody)"/>
  <!-- Upper diagonal arm -->
  <path d="M400 512 L400 448 L648 218 L748 218 L748 262 L472 512 Z" fill="url(#kBody)"/>
  <!-- Lower diagonal arm -->
  <path d="M400 512 L472 512 L748 762 L748 806 L648 806 L400 576 Z" fill="url(#kBody)"/>

  <!-- Creative accent: media-generation spark at K junction -->
  <circle cx="436" cy="512" r="42" fill="url(#accent)" opacity="0.9"/>
  <circle cx="436" cy="512" r="22" fill="#ffffff" opacity="0.95"/>

  <!-- Radiating creation rays (subtle, top-right) -->
  <g stroke-linecap="round" fill="none" opacity="0.7">
    <line x1="770" y1="196" x2="836" y2="156" stroke="url(#spark1)" stroke-width="14"/>
    <line x1="790" y1="248" x2="868" y2="228" stroke="url(#spark1)" stroke-width="12"/>
    <line x1="780" y1="300" x2="852" y2="306" stroke="url(#spark1)" stroke-width="10"/>
  </g>

  <!-- Small diamond sparkle accent (bottom-right) -->
  <path d="M808 740 L824 764 L808 788 L792 764 Z" fill="#a78bfa" opacity="0.6"/>
</svg>
